<svg xmlns="http://www.w3.org/2000/svg" width="900" height="344" viewBox="0 0 900 344" role="img" aria-label="Durjoy Saha - AI/ML student">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#060911"/>
      <stop offset="0.5" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#0b0f1d"/>
    </linearGradient>

    <radialGradient id="a1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6fff8"/>
      <stop offset="0.45" stop-color="#a5f3ea"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>

    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Inter, system-ui, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }
    .breathe { animation: breathe 7s ease-in-out infinite; }
    .tw { animation: tw 4s ease-in-out infinite; }
    .type { transform-box: fill-box; transform-origin: left center; animation: type 1.5s cubic-bezier(.2,.7,.3,1) both; }
    .caret { animation: blink 1.4s steps(1,end) infinite; }
    @keyframes breathe { 0%,100% { opacity: .92; } 50% { opacity: 1; } }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .8; } }
    @keyframes type { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 0%,45% { opacity: 1; } 46%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .breathe,.tw,.caret { animation: none; }
      .type { animation: none; }
    }
  </style>

  <rect width="900" height="344" rx="18" fill="url(#night)"/>

  <g filter="url(#blur24)">
    <ellipse cx="180" cy="70" rx="230" ry="120" fill="url(#a1)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 90 40; -30 18; 0 0" dur="26s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="120" rx="250" ry="130" fill="url(#a2)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -80 34; 24 -20; 0 0" dur="21s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="440" cy="300" rx="280" ry="110" fill="url(#a3)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 60 -30; -70 -12; 0 0" dur="30s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g fill="#dbeafe">
    <circle class="tw" cx="120" cy="240" r="1.3"/>
    <circle class="tw" cx="255" cy="60" r="1" style="animation-delay:-1.2s"/>
    <circle class="tw" cx="520" cy="42" r="1.4" style="animation-delay:-2.4s"/>
    <circle class="tw" cx="660" cy="230" r="1" style="animation-delay:-0.6s"/>
    <circle class="tw" cx="790" cy="70" r="1.3" style="animation-delay:-3.1s"/>
    <circle class="tw" cx="840" cy="250" r="1" style="animation-delay:-1.8s"/>
    <circle class="tw" cx="360" cy="270" r="1.2" style="animation-delay:-2.8s"/>
  </g>

  <rect x="1" y="1" width="898" height="342" rx="18" fill="none" stroke="#5eead4" stroke-opacity="0.18"/>

  <g class="sans" text-anchor="middle">
    <text class="breathe" x="450" y="112" font-size="58" font-weight="300" letter-spacing="9"
          fill="url(#nameFill)" filter="url(#soft)">DURJOY SAHA</text>
    <text x="450" y="146" font-size="14" font-weight="400" letter-spacing="4.5" fill="#7f8fa6">
      AUDIO DEEPFAKE DETECTION  ·  NLP  ·  FULL-STACK
    </text>
  </g>

  <g class="mono">
    <text x="72" y="212" font-size="15" fill="#5eead4" class="type" style="animation-delay:.3s">
      <tspan fill="#475569">$</tspan> listening for the difference between a voice and a copy of one
    </text>
    <text x="72" y="242" font-size="15" fill="#a5b4fc" class="type" style="animation-delay:1.5s">
      <tspan fill="#475569">$</tspan> wav2vec2 · asvspoof · in-the-wild · eer / auc
    </text>
    <text x="72" y="272" font-size="15" fill="#94a3b8" class="type" style="animation-delay:2.7s">
      <tspan fill="#475569">$</tspan> explainable first — a score you cannot read is not finished
    </text>
    <text x="72" y="302" font-size="15" fill="#5eead4" class="caret">$ <tspan fill="#e2e8f0">_</tspan></text>
  </g>
</svg>
