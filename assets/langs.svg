<svg xmlns="http://www.w3.org/2000/svg" width="780" height="404" viewBox="0 0 780 404" role="img" aria-label="Programming languages by bytes on GitHub">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bars">
      <rect x="176" y="70" width="520" height="300" rx="6"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Inter, system-ui, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.25s cubic-bezier(.16,.84,.24,1) both; }
    .fade { animation: fade .9s ease both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .grow,.fade { animation: none; } }
  </style>

  <rect width="780" height="404" rx="16" fill="url(#panel)"/>
  <rect x="1" y="1" width="778" height="402" rx="16" fill="none" stroke="#94a3b8" stroke-opacity="0.14"/>

  <g class="sans">
    <text x="34" y="42" font-size="17" font-weight="600" fill="#e2e8f0" letter-spacing="0.4">Languages, by bytes on my GitHub</text>
    <text x="34" y="60" font-size="11.5" fill="#64748b" class="mono">jupyter notebooks carry the ML work, so they dominate the raw count</text>
  </g>

  <g class="sans" font-size="13" fill="#cbd5e1">
    <text x="34" y="90">Jupyter Notebook</text>
    <text x="34" y="120">PHP</text>
    <text x="34" y="150">C#</text>
    <text x="34" y="180">Java</text>
    <text x="34" y="210">Python</text>
    <text x="34" y="240">CSS</text>
    <text x="34" y="270">JavaScript</text>
    <text x="34" y="300">HTML</text>
    <text x="34" y="330">C++</text>
    <text x="34" y="360">TypeScript</text>
  </g>

  <g>
    <rect x="176" y="78" width="520" height="9" rx="4.5" fill="#1e293b" opacity="0.55"/>
    <rect x="176" y="108" width="520" height="9" rx="4.5" fill="#1e293b" opacity="0.55"/>
    <rect x="176" y="138" width="520" height="9" rx="4.5" fill="#1e293b" opacity="0.55"/>
    <rect x="176" y="168" width="520" height="9" rx="4.5" fill="#1e293b" opacity="0.55"/>
    <rect x="176" y="198" width="520" height="9" rx="4.5" fill="#1e293b" opacity="0.55"/>
    <rect x="176" y="228" width="520" height="9" rx="4.5" fill="#1e293b" opacity="0.55"/>
    <rect x="176" y="258" width="520" height="9" rx="4.5" fill="#1e293b" opacity="0.55"/>
    <rect x="176" y="288" width="520" height="9" rx="4.5" fill="#1e293b" opacity="0.55"/>
    <rect x="176" y="318" width="520" height="9" rx="4.5" fill="#1e293b" opacity="0.55"/>
    <rect x="176" y="348" width="520" height="9" rx="4.5" fill="#1e293b" opacity="0.55"/>
  </g>

  <g>
    <rect class="grow" x="176" y="78" width="520" height="9" rx="4.5" fill="#f0a35e" style="animation-delay:.10s"/>
    <rect class="grow" x="176" y="108" width="146" height="9" rx="4.5" fill="#8f9bd4" style="animation-delay:.22s"/>
    <rect class="grow" x="176" y="138" width="129" height="9" rx="4.5" fill="#5fb87a" style="animation-delay:.34s"/>
    <rect class="grow" x="176" y="168" width="84"  height="9" rx="4.5" fill="#c98a3c" style="animation-delay:.46s"/>
    <rect class="grow" x="176" y="198" width="72"  height="9" rx="4.5" fill="#5b9fd0" style="animation-delay:.58s"/>
    <rect class="grow" x="176" y="228" width="71"  height="9" rx="4.5" fill="#9b7fd4" style="animation-delay:.70s"/>
    <rect class="grow" x="176" y="258" width="61"  height="9" rx="4.5" fill="#e6d365" style="animation-delay:.82s"/>
    <rect class="grow" x="176" y="288" width="38"  height="9" rx="4.5" fill="#e07a55" style="animation-delay:.94s"/>
    <rect class="grow" x="176" y="318" width="35"  height="9" rx="4.5" fill="#e07b9b" style="animation-delay:1.06s"/>
    <rect class="grow" x="176" y="348" width="22"  height="9" rx="4.5" fill="#4b9fd4" style="animation-delay:1.18s"/>
  </g>

  <g clip-path="url(#bars)">
    <rect x="-200" y="70" width="200" height="300" fill="url(#sheen)">
      <animate attributeName="x" from="-200" to="780" dur="5.5s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="mono" font-size="12" fill="#94a3b8" text-anchor="end">
    <text class="fade" x="752" y="90" style="animation-delay:.30s">81.3%</text>
    <text class="fade" x="752" y="120" style="animation-delay:.42s">6.4%</text>
    <text class="fade" x="752" y="150" style="animation-delay:.54s">5.0%</text>
    <text class="fade" x="752" y="180" style="animation-delay:.66s">2.1%</text>
    <text class="fade" x="752" y="210" style="animation-delay:.78s">1.6%</text>
    <text class="fade" x="752" y="240" style="animation-delay:.90s">1.5%</text>
    <text class="fade" x="752" y="270" style="animation-delay:1.02s">1.1%</text>
    <text class="fade" x="752" y="300" style="animation-delay:1.14s">0.4%</text>
    <text class="fade" x="752" y="330" style="animation-delay:1.26s">0.4%</text>
    <text class="fade" x="752" y="360" style="animation-delay:1.38s">0.2%</text>
  </g>

  <text x="34" y="392" font-size="11" fill="#475569" class="mono">bar length uses a square-root scale · percentages are the real share</text>
</svg>
